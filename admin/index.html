<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <title>Admin</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body { font-family: Arial; background:#f4f6f8; padding:40px; }
    .box { background:#fff; padding:30px; max-width:600px; margin:auto; border-radius:10px; }
    h2 { margin-top:30px; }
    textarea { width:100%; min-height:100px; margin-top:10px; }
    button { margin-top:20px; width:100%; padding:12px; }
  </style>
</head>
<body>

<div class="box">
  <h1>Admin</h1>

  <h2>Home</h2>
  <textarea id="home"></textarea>

  <h2>Over</h2>
  <textarea id="over"></textarea>

  <h2>Diensten</h2>
  <textarea id="diensten"></textarea>

  <h2>Werving</h2>
  <textarea id="werving"></textarea>

  <h2>Contact</h2>
  <textarea id="contact"></textarea>

  <button onclick="save()">Opslaan</button>
</div>

<script>
function save() {
  localStorage.setItem("home", home.value);
  localStorage.setItem("over", over.value);
  localStorage.setItem("diensten", diensten.value);
  localStorage.setItem("werving", werving.value);
  localStorage.setItem("contact", contact.value);
  alert("Opgeslagen.");
}

home.value = localStorage.getItem("home") || "";
over.value = localStorage.getItem("over") || "";
diensten.value = localStorage.getItem("diensten") || "";
werving.value = localStorage.getItem("werving") || "";
contact.value = localStorage.getItem("contact") || "";
</script>

</body>
</html>
